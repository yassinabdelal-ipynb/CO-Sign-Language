name: CPU correctness
permissions:
  contents: read
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install core CPU runtime
        shell: bash
        run: |
          python -m pip install --only-binary=:all: torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --only-binary=:all: -r requirements.txt
          python -m pip check
      - name: Test and replay without hardware assets
        shell: bash
        run: |
          python -m unittest discover -s tests -v
          python realtime_detection.py --events demos/events.jsonl
          python scripts/audit_publication.py
